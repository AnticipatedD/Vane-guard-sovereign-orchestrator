# Close stale issues and PRs (PRs are labeled stale but never auto-closed).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

name: Close stale issues and PRs

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Run stale action
        uses: actions/stale@a20b814fb01b71def3bd6f56e7494d667ddf28da # v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "Hey there, we've marked this issue as stale because there's no recent activity on it. This label helps us identify long-standing issues in our repo (and not used to auto-close issues)."
          stale-pr-message: "Hey there, we've marked this pull request as stale because there's no recent activity on it. This label helps us identify PRs that might need updates or need maintainer attention."
          days-before-stale: 14
          days-before-close: -1
          days-before-pr-close: -1
          exempt-pr-labels: "never-stale"
          exempt-issue-labels: "never-stale"
          operations-per-run: 500
